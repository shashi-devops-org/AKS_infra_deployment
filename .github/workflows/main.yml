name: aks infra pipeline
on:
  workflow_dispatch:
permissions:
 id-token: write
 contents: read
jobs:
  test-azure:
   runs-on: self-hosted
   steps: 
    - name: checkout
      uses: actions/checkout@v4
    - name: Azure Login
      uses: Azure/login@v3.0.2
      with:
        client-id: ${{vars.AZURE_CLIENT_ID}}
        tenant-id: ${{vars.AZURE_TENANT_ID}}
        subscription-id: ${{vars.AZURE_SUBSCRIPTION_ID}}
       
